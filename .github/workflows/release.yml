name: Release

# Builds a Windows installer from the source and attaches it to GitHub release.
on:
  push:
    branches: ["custom-features"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check versions match
        shell: bash
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          iss_ver=$(grep -m1 '#define AppVersion' installer/bitchord.iss | cut -d'"' -f2)
          echo "Cargo.toml $cargo_ver, bitchord.iss $iss_ver"
          [ "$cargo_ver" = "$iss_ver" ] || { echo "version mismatch"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$cargo_ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match v$cargo_ver"; exit 1
          fi
          echo "VERSION=$cargo_ver" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked

      # webview2-com-sys extracts WebView2Loader.dll into its build OUT_DIR rather than
      # next to the exe; the installer expects it in BinDir, so copy it there.
      - name: Stage WebView2Loader.dll
        run: |
          $dll = Get-ChildItem -Path "target\release\build\*\out\x64\WebView2Loader.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem -Path "$HOME\.cargo\registry\src\*\webview2-com-sys-*\x64\WebView2Loader.dll" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $dll) {
            Get-ChildItem -Path "target\release\build" -Filter "webview2*" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              Get-ChildItem -Path $_.FullName -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 12 | ForEach-Object { Write-Host "saw: $($_.FullName)" }
            }
            Write-Error "WebView2Loader.dll (x64) not found under target\release\build"; exit 1
          }
          Copy-Item $dll.FullName "target\release\WebView2Loader.dll" -Force
          Write-Host "staged $($dll.FullName) -> target\release\WebView2Loader.dll"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer\bitchord.iss
          if ($LASTEXITCODE) { exit 1 }

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: installer/Output/bitchord-setup-${{ env.VERSION }}.exe
          if-no-files-found: error

  attach:
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: windows
          path: files

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          TAG="v${VERSION}"
          echo "Releasing $TAG"
          ls -la files
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" files/* --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" files/* --title "BitChord $TAG" --notes "BitChord $TAG Windows Release"
          fi
